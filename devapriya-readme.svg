<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Devapriya V – GitHub profile</title>
  <desc id="d">Undergraduate Computer Applications student at St. Claret College, Bengaluru. Focus: Machine Learning and Analytics. Adapts to light and dark themes.</desc>

  <style>
    /* ============ Condition 1: light theme (default) ============ */
    :root {
      --bg: #ffffff;
      --card: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #0969da;
      --accent2: #8250df;
      --chip-bg: #ddf4ff;
      --chip-text: #0550ae;
      --badge-l: #57606a;
      --badge-r1: #5865f2;
      --badge-r2: #d6336c;
      --glow: 0.12;
    }

    /* ============ Condition 2: dark theme ============ */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent2: #bc8cff;
        --chip-bg: #1f2d3d;
        --chip-text: #79c0ff;
        --badge-l: #484f58;
        --badge-r1: #6c78ff;
        --badge-r2: #e83e8c;
        --glow: 0.24;
      }
    }

    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg     { fill: var(--bg); }
    .card   { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .name   { fill: var(--text); font-size: 68px; font-weight: 800; letter-spacing: -1px; }
    .role   { fill: var(--text); font-size: 26px; font-weight: 600; }
    .tag    { fill: var(--muted); font-size: 22px; font-style: italic; }
    .hello  { fill: var(--accent); font-size: 17px; }
    .chip   { fill: var(--chip-bg); stroke: var(--border); stroke-width: 1; }
    .chip-t { fill: var(--chip-text); font-size: 17px; font-weight: 700; }
    .b-l    { fill: var(--badge-l); }
    .b-r1   { fill: var(--badge-r1); }
    .b-r2   { fill: var(--badge-r2); }
    .b-t    { fill: #ffffff; font-size: 16px; font-weight: 700; letter-spacing: 3px; }
    .b-ico  { fill: #ffffff; }
    .glow1  { fill: var(--accent);  opacity: var(--glow); }
    .glow2  { fill: var(--accent2); opacity: var(--glow); }
    .s1     { stop-color: var(--accent); }
    .s2     { stop-color: var(--accent2); }

    /* ============ Animations ============ */
    .rise   { opacity: 0; animation: rise 0.8s ease-out forwards; }
    .d1 { animation-delay: .10s; } .d2 { animation-delay: .30s; } .d3 { animation-delay: .50s; }
    .d4 { animation-delay: .70s; } .d5 { animation-delay: .90s; } .d6 { animation-delay: 1.1s; }
    .bar    { transform-box: fill-box; transform-origin: center; animation: grow 1.1s .1s ease-out both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .f1     { animation: float 7s ease-in-out infinite; }
    .f2     { animation: float 9s ease-in-out infinite reverse; }

    @keyframes rise  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes float { 50% { transform: translateY(-12px); } }

    /* ============ Condition 3: hover (only when the SVG is opened directly;
       GitHub shows README SVGs as static images, so hover won't fire there) ============ */
    @media (hover: hover) {
      .chip-g { transform-box: fill-box; transform-origin: center; transition: transform .2s ease; cursor: default; }
      .chip-g:hover { transform: translateY(-3px) scale(1.06); }
    }

    /* ============ Condition 4: narrow rendering (phones) ============ */
    @media (max-width: 600px) {
      .glows { display: none; }
      .role  { font-size: 30px; }
      .tag   { font-size: 26px; }
      .chip-t{ font-size: 19px; }
    }

    /* ============ Condition 5: reduced motion ============ */
    @media (prefers-reduced-motion: reduce) {
      .rise, .bar, .cursor, .f1, .f2 { animation: none !important; opacity: 1; transform: none; }
    }
  </style>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="s1"/><stop offset="1" class="s2"/>
    </linearGradient>
    <clipPath id="clip"><rect x="10" y="10" width="880" height="560" rx="18"/></clipPath>
  </defs>

  <rect class="bg" width="900" height="580"/>
  <rect class="card" x="10" y="10" width="880" height="560" rx="18"/>

  <!-- Decorative glows -->
  <g class="glows" clip-path="url(#clip)">
    <circle class="glow1 f1" cx="800" cy="90"  r="130"/>
    <circle class="glow2 f2" cx="110" cy="500" r="110"/>
  </g>

  <!-- Gradient bar -->
  <rect class="bar" x="405" y="58" width="90" height="5" rx="2.5" fill="url(#g)"/>

  <!-- Greeting -->
  <text class="rise d1 hello mono" x="450" y="102" text-anchor="middle">&gt; hello_world.sh</text>

  <!-- Name -->
  <text class="rise d2 name" x="450" y="178" text-anchor="middle">Devapriya V</text>

  <!-- Role -->
  <text class="rise d3 role" x="450" y="232" text-anchor="middle">Undergraduate Computer Applications Student</text>
  <text class="rise d3 role" x="450" y="268" text-anchor="middle">@ St. Claret College, Bengaluru</text>

  <!-- Tagline -->
  <text class="rise d4 tag" x="450" y="320" text-anchor="middle">Transforming complex data pipelines into</text>
  <text class="rise d4 tag" x="450" y="350" text-anchor="middle">actionable, intelligent insights.<tspan class="cursor mono hello" dx="6">▍</tspan></text>

  <!-- Badge: FOCUS -->
  <g class="rise d5">
    <rect class="b-r1" x="172" y="385" width="556" height="38" rx="6"/>
    <path class="b-l" d="M178 385 H302 V423 H178 A6 6 0 0 1 172 417 V391 A6 6 0 0 1 178 385 Z"/>
    <rect class="b-ico" x="190" y="404" width="5" height="9" rx="1"/>
    <rect class="b-ico" x="198" y="398" width="5" height="15" rx="1"/>
    <rect class="b-ico" x="206" y="392" width="5" height="21" rx="1"/>
    <text class="b-t mono" x="222" y="410">FOCUS</text>
    <text class="b-t mono" x="515" y="410" text-anchor="middle">MACHINE LEARNING &amp; ANALYTICS</text>
  </g>

  <!-- Badge: BASE -->
  <g class="rise d5">
    <rect class="b-r2" x="263" y="435" width="374" height="38" rx="6"/>
    <path class="b-l" d="M269 435 H373 V473 H269 A6 6 0 0 1 263 467 V441 A6 6 0 0 1 269 435 Z"/>
    <path class="b-ico" d="M291 466 C284 457 281 454 281 450 A10 10 0 0 1 301 450 C301 454 298 457 291 466 Z"/>
    <circle cx="291" cy="450" r="3.5" fill="var(--badge-l)"/>
    <text class="b-t mono" x="313" y="460">BASE</text>
    <text class="b-t mono" x="505" y="460" text-anchor="middle">BENGALURU, INDIA</text>
  </g>

  <!-- Skill chips -->
  <g class="rise d6">
    <g class="chip-g"><rect class="chip" x="65"  y="505" width="104" height="36" rx="18"/><text class="chip-t" x="117" y="528" text-anchor="middle">Python</text></g>
    <g class="chip-g"><rect class="chip" x="181" y="505" width="150" height="36" rx="18"/><text class="chip-t" x="256" y="528" text-anchor="middle">Data Science</text></g>
    <g class="chip-g"><rect class="chip" x="343" y="505" width="188" height="36" rx="18"/><text class="chip-t" x="437" y="528" text-anchor="middle">Machine Learning</text></g>
    <g class="chip-g"><rect class="chip" x="543" y="505" width="160" height="36" rx="18"/><text class="chip-t" x="623" y="528" text-anchor="middle">Cybersecurity</text></g>
    <g class="chip-g"><rect class="chip" x="715" y="505" width="120" height="36" rx="18"/><text class="chip-t" x="775" y="528" text-anchor="middle">Analytics</text></g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
